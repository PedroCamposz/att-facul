<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Média</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .card {
    background: #fff;
    padding: 30px 40px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    text-align: center;
    width: 300px;
  }
  input {
    width: 100%;
    padding: 8px;
    margin: 8px 0;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 5px;
  }
  button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 15px;
  }
  button:hover {
    background: #1d4ed8;
  }
  #resultado {
    margin-top: 15px;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="card">
  <h2>Calculadora de Média</h2>
  <input type="number" id="nota1" placeholder="1ª nota" step="0.1">
  <input type="number" id="nota2" placeholder="2ª nota" step="0.1">
  <input type="number" id="nota3" placeholder="3ª nota" step="0.1">
  <button onclick="calcularMedia()">Calcular</button>
  <p id="resultado"></p>
</div>

<script>
function calcularMedia() {
  const nota1 = parseFloat(document.getElementById("nota1").value);
  const nota2 = parseFloat(document.getElementById("nota2").value);
  const nota3 = parseFloat(document.getElementById("nota3").value);
  const resultado = document.getElementById("resultado");

  if (isNaN(nota1) || isNaN(nota2) || isNaN(nota3)) {
    resultado.style.color = "red";
    resultado.textContent = "Preencha as três notas!";
    return;
  }

  const media = (nota1 + nota2 + nota3) / 3;

  if (media >= 7) {
    resultado.style.color = "green";
    resultado.textContent = `Média: ${media.toFixed(2)} — Aprovado`;
  } else {
    resultado.style.color = "red";
    resultado.textContent = `Média: ${media.toFixed(2)} — Reprovado`;
  }
}
</script>

</body>
</html>
