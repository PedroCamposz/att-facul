<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 15px;
  }

  .app {
    background: #fff;
    width: 100%;
    max-width: 420px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    overflow: hidden;
  }

  header {
    background: #1f2937;
    color: #fff;
    padding: 20px;
    text-align: center;
  }

  header h1 {
    margin: 0;
    font-size: 22px;
  }

  header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: #9ca3af;
  }

  .form-tarefa {
    display: flex;
    gap: 8px;
    padding: 16px 20px;
    border-bottom: 1px solid #eee;
  }

  .form-tarefa input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
  }

  .form-tarefa input:focus {
    outline: none;
    border-color: #764ba2;
  }

  .form-tarefa button {
    background: #764ba2;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 16px;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .form-tarefa button:hover {
    background: #5f3d84;
  }

  .contador {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    font-size: 13px;
    color: #6b7280;
  }

  .contador button {
    background: none;
    border: none;
    color: #dc2626;
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
  }

  .contador button:hover {
    color: #991b1b;
  }

  ul#listaTarefas {
    list-style: none;
    margin: 0;
    padding: 0 10px 15px;
    max-height: 380px;
    overflow-y: auto;
  }

  ul#listaTarefas li {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f9fafb;
    padding: 10px 12px;
    border-radius: 8px;
    margin: 6px 10px;
    animation: entrar 0.2s ease;
  }

  @keyframes entrar {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  ul#listaTarefas li.concluida span {
    text-decoration: line-through;
    color: #9ca3af;
  }

  ul#listaTarefas li input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #764ba2;
    cursor: pointer;
  }

  ul#listaTarefas li span {
    flex: 1;
    font-size: 14px;
    word-break: break-word;
  }

  ul#listaTarefas li button {
    background: none;
    border: none;
    color: #ef4444;
    font-size: 17px;
    cursor: pointer;
    line-height: 1;
  }

  ul#listaTarefas li button:hover {
    color: #b91c1c;
  }

  .vazio {
    text-align: center;
    color: #9ca3af;
    font-size: 14px;
    padding: 30px 20px;
  }

  @media (max-width: 480px) {
    .app { border-radius: 0; }
    body { padding: 0; align-items: stretch; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>📋 Minhas Tarefas</h1>
    <p>Salvo automaticamente no seu navegador</p>
  </header>

  <form class="form-tarefa" id="formTarefa">
    <input type="text" id="inputTarefa" placeholder="Digite uma nova tarefa..." maxlength="120" required>
    <button type="submit">+</button>
  </form>

  <div class="contador">
    <span id="contadorTexto">0 tarefas</span>
    <button type="button" id="btnLimparTudo">Limpar tudo</button>
  </div>

  <ul id="listaTarefas"></ul>
</div>

<script>
  const CHAVE_STORAGE = "todo-lista-tarefas";

  const form = document.getElementById("formTarefa");
  const input = document.getElementById("inputTarefa");
  const lista = document.getElementById("listaTarefas");
  const contadorTexto = document.getElementById("contadorTexto");
  const btnLimparTudo = document.getElementById("btnLimparTudo");

  // ---------- LocalStorage: recuperar e salvar ----------
  function carregarTarefas() {
    const dados = localStorage.getItem(CHAVE_STORAGE);
    return dados ? JSON.parse(dados) : [];
  }

  function salvarTarefas(tarefas) {
    localStorage.setItem(CHAVE_STORAGE, JSON.stringify(tarefas));
  }

  let tarefas = carregarTarefas();

  // ---------- Renderização ----------
  function renderizar() {
    lista.innerHTML = "";

    if (tarefas.length === 0) {
      lista.innerHTML = `<li class="vazio" style="background:none;">Nenhuma tarefa por aqui. Adicione a primeira! ✨</li>`;
    } else {
      tarefas.forEach((tarefa, indice) => {
        const item = document.createElement("li");
        if (tarefa.concluida) item.classList.add("concluida");

        item.innerHTML = `
          <input type="checkbox" ${tarefa.concluida ? "checked" : ""} data-indice="${indice}">
          <span>${tarefa.texto}</span>
          <button type="button" data-indice="${indice}" title="Excluir tarefa">✕</button>
        `;
        lista.appendChild(item);
      });
    }

    const concluidas = tarefas.filter(t => t.concluida).length;
    contadorTexto.textContent = tarefas.length === 0
      ? "0 tarefas"
      : `${concluidas} de ${tarefas.length} concluídas`;
  }

  // ---------- Adicionar tarefa ----------
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const texto = input.value.trim();
    if (texto === "") return;

    tarefas.push({ texto: texto, concluida: false });
    salvarTarefas(tarefas);
    renderizar();

    input.value = "";
    input.focus();
  });

  // ---------- Marcar como concluída / excluir (delegação de eventos) ----------
  lista.addEventListener("click", (e) => {
    const indice = e.target.dataset.indice;
    if (indice === undefined) return;

    if (e.target.type === "checkbox") {
      tarefas[indice].concluida = e.target.checked;
      salvarTarefas(tarefas);
      renderizar();
    }

    if (e.target.tagName === "BUTTON") {
      tarefas.splice(indice, 1);
      salvarTarefas(tarefas);
      renderizar();
    }
  });

  // ---------- Limpar tudo ----------
  btnLimparTudo.addEventListener("click", () => {
    if (tarefas.length === 0) return;
    const confirmar = confirm("Tem certeza que deseja apagar todas as tarefas?");
    if (confirmar) {
      tarefas = [];
      localStorage.removeItem(CHAVE_STORAGE);
      renderizar();
    }
  });

  // ---------- Inicialização ----------
  renderizar();
</script>

</body>
</html>
